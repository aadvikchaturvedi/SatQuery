[flake8]
max-line-length = 120
# The excluded lines are prose inside triple-quoted LLM prompt templates,
# not code — wrapping them would only make the prompts harder to read.
per-file-ignores =
    app/tools/caption_tool.py:E501
    app/tools/fusion_tool.py:E501
    app/tools/vqa_tool.py:E501
    app/tools/change_tool.py:E501
